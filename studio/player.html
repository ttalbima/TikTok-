<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Anton'; src: url('fonts/anton-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Anton'; src: url('fonts/anton-latin-ext-400-normal.woff2') format('woff2'); unicode-range: U+0100-02AF, U+1E00-1EFF, U+20A0-20AB, U+20AD-20CF; }
@font-face { font-family: 'InterX'; font-weight: 800; src: url('fonts/Inter-ExtraBold.otf'); }
@font-face { font-family: 'InterX'; font-weight: 900; src: url('fonts/Inter-Black.otf'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
#stage, .shot { position: absolute; inset: 0; overflow: hidden; }
#stage { isolation: isolate; }
.shot { display: none; }
.cam { position: absolute; inset: 0; transform-origin: 50% 42%; }
.pos { position: absolute; width: 0; height: 0; }
.an { position: absolute; left: 0; top: 0; width: max-content; visibility: hidden; }
.an.cut { filter: drop-shadow(10px 12px 0 rgba(0,0,0,.26)); }
.an > svg { display: block; }
.tx { white-space: nowrap; text-align: center; line-height: .98; text-transform: uppercase; }
.anton { font-family: 'Anton', sans-serif; letter-spacing: 2px; }
.inter { font-family: 'InterX', sans-serif; font-weight: 900; }
svg text { font-family: 'Anton', sans-serif; }
#wipe { position: absolute; top: -200px; left: 0; width: 1760px; height: 2320px; display: none; }
#grain { position: absolute; inset: 0; background-size: 1080px 1920px; image-rendering: pixelated; opacity: .11; mix-blend-mode: overlay; pointer-events: none; }
#subs { position: absolute; inset: 0; pointer-events: none; }
.chunk { position: absolute; left: 540px; top: 1425px; display: none; white-space: nowrap;
  font-family: 'InterX', sans-serif; font-weight: 800; font-size: 60px; letter-spacing: .5px; color: #F4EBD9;
  background: #14213D; border: 4px solid rgba(244,235,217,.28); border-radius: 26px; padding: 16px 30px 18px;
  box-shadow: 8px 10px 0 rgba(0,0,0,.28); }
.chunk span { display: inline-block; margin: 0 7px; }
.chunk span.act { color: #FFC83D; transform: scale(1.07); }
.glow, .amb { display: none; }
.s2 .glow { display: block; position: absolute; inset: 0; background: radial-gradient(circle at 50% 36%, rgba(255,255,255,.20), rgba(255,255,255,0) 60%); }
.s2 .amb { display: block; position: absolute; inset: 0; overflow: hidden; }
.s2 .amb > div { position: absolute; border-radius: 50%; }
.s2 .an.cut { filter: drop-shadow(0 24px 28px rgba(0,0,0,.30)); }
.s2 #grain { opacity: .05; }
.s2 .anton { letter-spacing: 0; }
.s2 .chunk { border: none; border-radius: 24px; color: #FFFFFF; background: rgba(26,18,69,.96); box-shadow: 0 18px 36px rgba(0,0,0,.38); }
.s2 .chunk span.act { color: #C8F560; }
.wm { display: inline-block; overflow: hidden; vertical-align: top; padding: .16em .05em .06em; margin: -.16em -.05em -.06em; }
.wi { display: inline-block; transform-origin: 0% 100%; }
</style>
</head>
<body>
<div id="root">
  <div id="stage"></div>
  <div id="wipe"></div>
  <div id="grain"></div>
  <div id="subs"></div>
</div>
<script src="engine.js"></script>
<script src="objets.js"></script>
</body>
</html>
